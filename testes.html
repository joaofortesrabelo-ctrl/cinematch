<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CineMatch — Testes automáticos</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f5f3fb; color: #1c1830; }
    main { max-width: 860px; margin: 0 auto; padding: 32px 20px 48px; }
    h1 { margin: 0 0 4px; }
    .sub { color: #5f5978; margin: 0 0 20px; }
    .resumo { font-size: 1.3rem; font-weight: 800; padding: 16px 20px; border-radius: 16px; margin-bottom: 24px; }
    .passou { background: #dcfce7; color: #14532d; }
    .falhou { background: #fee2e2; color: #7f1d1d; }
    section { background: #fff; border: 1px solid #e2ddef; border-radius: 16px; padding: 16px 20px; margin-bottom: 14px; }
    h2 { font-size: 1.05rem; margin: 0 0 8px; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
    li.erro { color: #991b1b; font-weight: 600; }
    small { font-weight: 400; color: #7f1d1d; }
    a { color: #6d28d9; }
  </style>
</head>
<body>
  <main>
    <h1>🧪 Testes do sistema de recomendação</h1>
    <p class="sub">Roda direto no navegador, sem instalar nada. <a href="index.html">← Voltar para o CineMatch</a></p>
    <p class="resumo" id="resumo" role="status">Rodando…</p>
    <div id="lista"></div>
  </main>
  <!-- Mesmos arquivos do app + os testes -->
  <script src="js/movies.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/testes.js"></script>
</body>
</html>
